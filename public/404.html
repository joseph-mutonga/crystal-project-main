<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 — Page Not Found | Crystal Crest Luxury Cosmetics</title>
  <meta name="description" content="The luxury formulation or page you are looking for could not be found.">
  
  <!-- Tailwind CSS via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            blush: '#F8E8E8',
            rose: '#E8C500',
            lavender: '#C9A0DC',
            'deep-purple': '#9B72CF',
            ivory: '#FDFAF5',
            charcoal: '#1C1C1E'
          }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="bg-ivory text-charcoal min-h-screen flex flex-col antialiased">

  <!-- Header -->
  <header id="main-header"></header>

  <main class="flex-1 flex items-center justify-center max-w-4xl mx-auto px-4 py-16 text-center w-full">
    <div class="glass-card rounded-3xl p-8 sm:p-14 space-y-6 border-t-4 border-t-deep-purple shadow-2xl animate-fade-in w-full max-w-xl">
      <div class="w-20 h-20 rounded-full bg-blush text-deep-purple mx-auto flex items-center justify-center shadow-inner">
        <span class="font-serif-heading text-3xl font-bold">404</span>
      </div>

      <div class="space-y-2">
        <span class="text-xs uppercase tracking-[0.25em] text-deep-purple font-bold">Bespoke Destination</span>
        <h1 class="font-serif-heading text-4xl sm:text-5xl font-bold text-charcoal">Page Not Found</h1>
        <p class="text-xs sm:text-sm text-gray-600 max-w-md mx-auto leading-relaxed pt-1">
          The requested page or formulation path does not exist or may have been relocated in our luxury catalog.
        </p>
      </div>

      <div class="flex flex-col sm:flex-row items-center justify-center gap-3 pt-4">
        <a href="/index.html" class="w-full sm:w-auto px-6 py-3 rose-glow-btn text-xs font-bold uppercase tracking-wider rounded-full shadow-md">
          Return to Home
        </a>
        <a href="/shop.html" class="w-full sm:w-auto px-6 py-3 border border-charcoal text-xs font-bold uppercase tracking-wider rounded-full hover:bg-blush transition-colors">
          Browse Shop Collection
        </a>
      </div>
    </div>
  </main>

  <!-- Footer -->
  <footer id="main-footer"></footer>

  <script type="module">
    import { UI } from '/js/shared/ui.js';
    document.addEventListener('DOMContentLoaded', () => {
      UI.initHeader('home');
      UI.initFooter();
    });
  </script>
</body>
</html>
