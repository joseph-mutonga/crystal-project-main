<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Products & Inventory | Crystal Crest</title>

  <!-- Tailwind CSS via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: '#E8C500',
            purple: '#9B72CF'
          }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body class="bg-gray-100 text-gray-800 antialiased font-sans flex min-h-screen">

  <aside id="admin-sidebar"></aside>

  <div class="flex-1 flex flex-col min-w-0 overflow-y-auto">
    <header id="admin-header"></header>

    <main class="p-6 space-y-6 max-w-7xl w-full mx-auto">
      
      <!-- Top Action Bar -->
      <div class="bg-white rounded-xl p-4 border border-gray-200 shadow-sm flex flex-col sm:flex-row items-center justify-between gap-4">
        <div class="flex items-center gap-3 w-full sm:w-auto">
          <input type="text" id="admin-product-search" placeholder="Search product name, category..." class="px-4 py-2 bg-gray-50 border border-gray-200 rounded-lg text-xs w-full sm:w-64 focus:outline-none focus:border-[#9B72CF]">
          <select id="admin-category-filter" class="px-3 py-2 bg-gray-50 border border-gray-200 rounded-lg text-xs font-medium focus:outline-none">
            <option value="all">All Categories</option>
          </select>
        </div>

        <button id="open-add-product-btn" class="px-5 py-2.5 bg-gray-900 text-white hover:bg-[#9B72CF] text-xs font-bold uppercase tracking-wider rounded-lg shadow transition-colors shrink-0">
          + Add New Product / Service
        </button>
      </div>

      <!-- Products Data Table -->
      <div class="bg-white rounded-xl border border-gray-200 shadow-sm overflow-hidden">
        <div class="overflow-x-auto">
          <table class="w-full text-left text-xs text-gray-700">
            <thead class="bg-gray-50 text-gray-500 font-bold uppercase tracking-wider text-[10px] border-b border-gray-200">
              <tr>
                <th class="p-3.5">Item Image</th>
                <th class="p-3.5">Product Name</th>
                <th class="p-3.5">Category</th>
                <th class="p-3.5">Selling Price (KSh)</th>
                <th class="p-3.5">Buying Cost (KSh)</th>
                <th class="p-3.5">Stock Qty</th>
                <th class="p-3.5">Status</th>
                <th class="p-3.5 text-right">Actions</th>
              </tr>
            </thead>
            <tbody id="admin-products-tbody" class="divide-y divide-gray-100">
              <tr><td colspan="8" class="p-6 text-center text-gray-400">Loading catalog...</td></tr>
            </tbody>
          </table>
        </div>
      </div>

    </main>
  </div>

  <!-- ADD / EDIT PRODUCT MODAL -->
  <div id="product-modal-backdrop" class="fixed inset-0 z-50 bg-gray-900/60 backdrop-blur-sm flex items-center justify-center p-4 hidden">
    <div class="bg-white rounded-2xl max-w-2xl w-full max-h-[90vh] overflow-y-auto shadow-2xl border border-gray-200 p-6 space-y-6">
      
      <div class="flex items-center justify-between border-b border-gray-100 pb-4">
        <h2 id="modal-title" class="font-serif-heading text-2xl font-bold text-gray-900">Add New Product</h2>
        <button id="close-product-modal" class="text-gray-400 hover:text-gray-600 font-bold text-xl">✕</button>
      </div>

      <form id="product-form" class="space-y-4 text-xs">
        <input type="hidden" id="product-id">

        <div>
          <label class="block font-bold text-gray-700 mb-1">Product / Service Name *</label>
          <input type="text" id="form-name" required placeholder="e.g. Imperial Leather Oxfords or Gold Serum" class="w-full px-4 py-2.5 rounded-lg border border-gray-200 bg-gray-50 focus:outline-none focus:border-[#9B72CF]">
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <div>
            <label class="block font-bold text-gray-700 mb-1">Category *</label>
            <select id="form-category-id" required class="w-full px-4 py-2.5 rounded-lg border border-gray-200 bg-gray-50 font-medium focus:outline-none focus:border-[#9B72CF]">
            </select>
          </div>

          <div>
            <label class="block font-bold text-gray-700 mb-1">Selling Price (KSh) *</label>
            <input type="number" step="1" id="form-price" required placeholder="28000" class="w-full px-4 py-2.5 rounded-lg border border-gray-200 bg-gray-50 focus:outline-none focus:border-[#9B72CF]">
          </div>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <div>
            <label class="block font-bold text-gray-700 mb-1">Buying / Unit Cost (KSh)</label>
            <input type="number" step="1" id="form-buying-price" placeholder="12000" class="w-full px-4 py-2.5 rounded-lg border border-gray-200 bg-gray-50 focus:outline-none focus:border-[#9B72CF]">
          </div>

          <div>
            <label class="block font-bold text-gray-700 mb-1">Stock Quantity</label>
            <input type="number" id="form-stock-quantity" value="50" class="w-full px-4 py-2.5 rounded-lg border border-gray-200 bg-gray-50 focus:outline-none focus:border-[#9B72CF]">
          </div>
        </div>

        <!-- Image File Upload (Multer) -->
        <div class="p-4 bg-gray-50 rounded-xl border border-gray-200 space-y-2">
          <label class="block font-bold text-gray-700">Product Image Upload (Multer)</label>
          <input type="file" id="form-image-file" accept="image/*" class="w-full text-xs text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-xs file:font-semibold file:bg-gray-900 file:text-white hover:file:bg-[#9B72CF]">
          <p class="text-[10px] text-gray-400">Stores image file in /public/images/products/</p>
        </div>

        <div>
          <label class="block font-bold text-gray-700 mb-1">Description</label>
          <textarea id="form-description" rows="3" placeholder="Product details, ingredients, or craftsmanship details..." class="w-full px-4 py-2.5 rounded-lg border border-gray-200 bg-gray-50 focus:outline-none focus:border-[#9B72CF]"></textarea>
        </div>

        <!-- DYNAMIC SHOES SPECIFIC FIELDS -->
        <div id="shoes-category-fields" class="p-4 bg-amber-50/70 rounded-xl border border-amber-200 space-y-3 hidden">
          <div class="flex items-center justify-between border-b border-amber-200/60 pb-2">
            <h4 class="font-bold text-amber-900 text-xs uppercase tracking-wider">Shoe Department & Variant Options</h4>
          </div>

          <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
            <div>
              <label class="block text-[11px] font-bold text-gray-700 mb-1">Target Group *</label>
              <select id="form-target-group" class="w-full px-3 py-2 rounded-lg border border-gray-200 bg-white font-medium">
                <option value="Men">Men's Shoes</option>
                <option value="Women">Women's Shoes</option>
                <option value="Children">Children's Shoes</option>
                <option value="Unisex">Unisex</option>
              </select>
            </div>

            <div>
              <label class="block text-[11px] font-bold text-gray-700 mb-1">Shoe Sizes (Comma separated)</label>
              <input type="text" id="form-shoe-sizes" placeholder="EU 40 / US 7.5, EU 42 / US 9" class="w-full px-3 py-2 rounded-lg border border-gray-200 bg-white">
            </div>

            <div>
              <label class="block text-[11px] font-bold text-gray-700 mb-1">Color Options (Comma separated)</label>
              <input type="text" id="form-shoe-colors" placeholder="Mahogany Brown, Midnight Black" class="w-full px-3 py-2 rounded-lg border border-gray-200 bg-white">
            </div>
          </div>
        </div>

        <!-- DYNAMIC SPA SERVICES SPECIFIC FIELDS -->
        <div id="spa-category-fields" class="p-4 bg-purple-50/70 rounded-xl border border-purple-200 space-y-3 hidden">
          <div class="flex items-center justify-between border-b border-purple-200/60 pb-2">
            <h4 class="font-bold text-purple-900 text-xs uppercase tracking-wider">Spa Ritual Specifications</h4>
          </div>

          <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
            <div>
              <label class="block text-[11px] font-bold text-gray-700 mb-1">Service Type *</label>
              <select id="form-spa-type" class="w-full px-3 py-2 rounded-lg border border-gray-200 bg-white font-medium">
                <option value="Nails">Nails & Manicure Rituals</option>
                <option value="Massage">Body Massages & Aromatherapy</option>
                <option value="Facial">Facials & Gold Rituals</option>
                <option value="Hair & Makeup">Hair & Artistry</option>
                <option value="Body Treatment">Body Scrub & Detox</option>
              </select>
            </div>

            <div>
              <label class="block text-[11px] font-bold text-gray-700 mb-1">Session Duration Options (Comma separated)</label>
              <input type="text" id="form-spa-duration" placeholder="60 Min Session, 90 Min Session" class="w-full px-3 py-2 rounded-lg border border-gray-200 bg-white font-medium">
            </div>
          </div>
        </div>

        <div class="flex items-center gap-2 pt-2">
          <input type="checkbox" id="form-is-active" checked class="accent-[#9B72CF] w-4 h-4">
          <label for="form-is-active" class="font-bold text-gray-700">Active product listed in shop</label>
        </div>

        <div class="flex justify-end gap-3 pt-4 border-t border-gray-100">
          <button type="button" id="cancel-product-modal" class="px-5 py-2.5 border border-gray-300 rounded-lg text-xs font-semibold text-gray-700 hover:bg-gray-100">Cancel</button>
          <button type="submit" class="px-6 py-2.5 bg-gray-900 text-white font-bold text-xs rounded-lg hover:bg-[#9B72CF] transition-colors">Save Product</button>
        </div>
      </form>

    </div>
  </div>

  <script type="module" src="js/products.js"></script>
</body>
</html>
