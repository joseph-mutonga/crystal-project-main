<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offers & Discounts | Crystal Crest Admin</title>

  <!-- Tailwind CSS via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: '#E8C500',
            purple: '#9B72CF'
          }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body class="bg-gray-100 text-gray-800 antialiased font-sans flex min-h-screen">

  <aside id="admin-sidebar"></aside>

  <div class="flex-1 flex flex-col min-w-0 overflow-y-auto">
    <header id="admin-header"></header>

    <main class="p-6 space-y-6 max-w-7xl w-full mx-auto">

      <!-- Summary Stat Cards -->
      <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
        <div class="bg-white rounded-xl p-4 border border-gray-200 shadow-sm">
          <p class="text-[10px] font-bold uppercase tracking-wider text-gray-400">Active Offers</p>
          <p id="stat-active-count" class="text-2xl font-bold text-emerald-600 mt-1">0</p>
        </div>
        <div class="bg-white rounded-xl p-4 border border-gray-200 shadow-sm">
          <p class="text-[10px] font-bold uppercase tracking-wider text-gray-400">Expired Offers</p>
          <p id="stat-expired-count" class="text-2xl font-bold text-gray-400 mt-1">0</p>
        </div>
        <div class="bg-white rounded-xl p-4 border border-gray-200 shadow-sm">
          <p class="text-[10px] font-bold uppercase tracking-wider text-gray-400">Total Products On Offer</p>
          <p id="stat-total-count" class="text-2xl font-bold text-gray-900 mt-1">0</p>
        </div>
      </div>

      <!-- Top Action Bar -->
      <div class="bg-white rounded-xl p-4 border border-gray-200 shadow-sm flex flex-col sm:flex-row items-center justify-between gap-4">
        <input type="text" id="offers-search" placeholder="Search discounted products..." class="px-4 py-2 bg-gray-50 border border-gray-200 rounded-lg text-xs w-full sm:w-72 focus:outline-none focus:border-[#9B72CF]">
        <a href="products.html" class="px-5 py-2.5 bg-gray-900 text-white hover:bg-[#9B72CF] text-xs font-bold uppercase tracking-wider rounded-lg shadow transition-colors shrink-0 text-center">
          + Add Offer In Products Catalog
        </a>
      </div>

      <!-- Offers Data Table -->
      <div class="bg-white rounded-xl border border-gray-200 shadow-sm overflow-hidden">
        <div class="overflow-x-auto">
          <table class="w-full text-left text-xs text-gray-700">
            <thead class="bg-gray-50 text-gray-500 font-bold uppercase tracking-wider text-[10px] border-b border-gray-200">
              <tr>
                <th class="p-3.5">Item Image</th>
                <th class="p-3.5">Product Name</th>
                <th class="p-3.5">Original Price</th>
                <th class="p-3.5">Offer Price</th>
                <th class="p-3.5">Discount</th>
                <th class="p-3.5">Time Remaining</th>
                <th class="p-3.5 text-right">Actions</th>
              </tr>
            </thead>
            <tbody id="offers-tbody" class="divide-y divide-gray-100">
              <tr><td colspan="7" class="p-6 text-center text-gray-400">Loading offers...</td></tr>
            </tbody>
          </table>
        </div>
      </div>

    </main>
  </div>

  <!-- EDIT OFFER MODAL -->
  <div id="offer-modal-backdrop" class="fixed inset-0 z-50 bg-gray-900/60 backdrop-blur-sm flex items-center justify-center p-4 hidden">
    <div class="bg-white rounded-2xl max-w-md w-full shadow-2xl border border-gray-200 p-6 space-y-5">

      <div class="flex items-center justify-between border-b border-gray-100 pb-4">
        <h2 id="offer-modal-title" class="font-serif-heading text-xl font-bold text-gray-900">Edit Offer</h2>
        <button id="close-offer-modal" class="text-gray-400 hover:text-gray-600 font-bold text-xl">✕</button>
      </div>

      <form id="offer-form" class="space-y-4 text-xs">
        <input type="hidden" id="offer-product-id">

        <div>
          <label class="block font-bold text-gray-700 mb-1">Discount Percentage (%) *</label>
          <input type="number" step="1" min="0" max="90" id="offer-discount-percentage" required class="w-full px-4 py-2.5 rounded-lg border border-gray-200 bg-gray-50 focus:outline-none focus:border-[#9B72CF]">
        </div>

        <div>
          <label class="block font-bold text-gray-700 mb-1">Offer Expires On *</label>
          <input type="datetime-local" id="offer-discount-expires" required class="w-full px-4 py-2.5 rounded-lg border border-gray-200 bg-gray-50 focus:outline-none focus:border-[#9B72CF]">
        </div>

        <div class="flex justify-end gap-3 pt-4 border-t border-gray-100">
          <button type="button" id="cancel-offer-modal" class="px-5 py-2.5 border border-gray-300 rounded-lg text-xs font-semibold text-gray-700 hover:bg-gray-100">Cancel</button>
          <button type="submit" class="px-6 py-2.5 bg-gray-900 text-white font-bold text-xs rounded-lg hover:bg-[#9B72CF] transition-colors">Save Offer</button>
        </div>
      </form>
    </div>
  </div>

  <script type="module" src="js/offers.js"></script>
</body>
</html>
