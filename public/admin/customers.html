<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Customers Directory | Crystal Crest</title>

  <!-- Tailwind CSS via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: '#E8C500',
            purple: '#9B72CF'
          }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body class="bg-gray-100 text-gray-800 antialiased font-sans flex min-h-screen">

  <aside id="admin-sidebar"></aside>

  <div class="flex-1 flex flex-col min-w-0 overflow-y-auto">
    <header id="admin-header"></header>

    <main class="p-6 space-y-6 max-w-7xl w-full mx-auto">
      
      <!-- Search & Filter Bar -->
      <div class="bg-white rounded-xl p-4 border border-gray-200 shadow-sm flex items-center justify-between">
        <div class="flex items-center gap-3 w-full sm:w-auto">
          <input type="text" id="admin-customer-search" placeholder="Search customer name, email, phone..." class="px-4 py-2 bg-gray-50 border border-gray-200 rounded-lg text-xs w-full sm:w-64 focus:outline-none focus:border-[#9B72CF]">
        </div>
        <span id="customer-count-badge" class="text-xs font-bold text-gray-500">0 Customers</span>
      </div>

      <!-- Customers Data Table -->
      <div class="bg-white rounded-xl border border-gray-200 shadow-sm overflow-hidden">
        <div class="overflow-x-auto">
          <table class="w-full text-left text-xs text-gray-700">
            <thead class="bg-gray-50 text-gray-500 font-bold uppercase tracking-wider text-[10px] border-b border-gray-200">
              <tr>
                <th class="p-3.5">Full Name</th>
                <th class="p-3.5">Email Address</th>
                <th class="p-3.5">Phone Number</th>
                <th class="p-3.5">Account Role</th>
                <th class="p-3.5">Joined Date</th>
                <th class="p-3.5">Total Orders</th>
                <th class="p-3.5 text-right">Lifetime Spent</th>
              </tr>
            </thead>
            <tbody id="admin-customers-tbody" class="divide-y divide-gray-100">
              <tr><td colspan="7" class="p-6 text-center text-gray-400">Loading customer accounts...</td></tr>
            </tbody>
          </table>
        </div>
      </div>

    </main>
  </div>

  <script type="module" src="js/customers.js"></script>
</body>
</html>
