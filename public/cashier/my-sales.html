<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Shift Sales Report | Crystal Crest Cashier Station</title>

  <!-- Tailwind CSS via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: '#E8C500',
            purple: '#9B72CF',
            charcoal: '#1C1C1E',
            ivory: '#FDFAF5'
          }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body class="bg-gray-100 text-gray-800 font-sans antialiased min-h-screen flex flex-col select-none">

  <!-- Cashier Header Navbar -->
  <header id="cashier-header"></header>

  <main class="flex-1 max-w-7xl w-full mx-auto p-4 sm:p-6 space-y-6">
    
    <!-- Top Stat Summary Cards -->
    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
      <div class="bg-white rounded-2xl p-6 border border-gray-200 shadow-sm flex items-center justify-between">
        <div>
          <span class="text-xs font-bold text-gray-400 uppercase tracking-wider block">Today's Transactions</span>
          <span id="shift-sales-count" class="font-serif-heading text-3xl font-bold text-gray-900 mt-1 block">0</span>
        </div>
        <div class="w-12 h-12 rounded-2xl bg-purple-50 text-[#9B72CF] flex items-center justify-center text-2xl font-bold">
          🛒
        </div>
      </div>

      <div class="bg-white rounded-2xl p-6 border border-gray-200 shadow-sm flex items-center justify-between">
        <div>
          <span class="text-xs font-bold text-gray-400 uppercase tracking-wider block">Today's Shift Revenue</span>
          <span id="shift-revenue-total" class="font-serif-heading text-3xl font-bold text-gray-900 mt-1 block">KSh 0</span>
        </div>
        <div class="w-12 h-12 rounded-2xl bg-amber-50 text-[#E8C500] flex items-center justify-center text-2xl font-bold">
          💰
        </div>
      </div>
    </div>

    <!-- Today's Sales Table -->
    <div class="bg-white rounded-2xl border border-gray-200 shadow-sm overflow-hidden space-y-4 p-6">
      <div class="flex items-center justify-between pb-4 border-b border-gray-100">
        <div>
          <h2 class="font-serif-heading text-2xl font-bold text-gray-900">Today's Completed POS Sales</h2>
          <p class="text-xs text-gray-500">Filtered for your cashier account shift today</p>
        </div>
        <button id="refresh-sales-btn" class="px-4 py-2 bg-gray-100 hover:bg-gray-200 text-gray-800 text-xs font-bold rounded-xl transition-colors">
          🔄 Refresh List
        </button>
      </div>

      <div class="overflow-x-auto">
        <table class="w-full text-left text-xs text-gray-700">
          <thead class="bg-gray-50 text-gray-500 font-bold uppercase tracking-wider text-[10px] border-b border-gray-200">
            <tr>
              <th class="p-3.5">Time</th>
              <th class="p-3.5">Order Number</th>
              <th class="p-3.5">Customer</th>
              <th class="p-3.5">Purchased Items</th>
              <th class="p-3.5">Payment Method</th>
              <th class="p-3.5 text-right">Sale Total (KSh)</th>
            </tr>
          </thead>
          <tbody id="my-sales-tbody" class="divide-y divide-gray-100">
            <tr><td colspan="6" class="p-6 text-center text-gray-400">Loading shift sales...</td></tr>
          </tbody>
        </table>
      </div>
    </div>

  </main>

  <script type="module" src="js/my-sales.js"></script>
</body>
</html>
